name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: {node-version: 22}
      - run: node --test test/*.test.js

  # the native copy of the simulation, which the balance matrix runs on, against public/game.js: every scenario of
  # the matrix, state for state (the tests above do a short part of this)
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: {node-version: 22}
      - run: node sim/js/verify.mjs full --jobs 4
