<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fruit Defense — проверка чёткости</title>
<style>
html,body{margin:0;background:#2d4a1f;color:#fff;font:700 14px system-ui,sans-serif}
#bg{position:fixed;left:0;top:0;z-index:0}
main{position:relative;z-index:1;padding:10px 12px}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
.row b{width:22px;font-size:18px}
canvas.t{width:300px;height:56px;background:#fff8ea;border-radius:8px}
.html{width:300px;height:56px;background:#fff8ea;border-radius:8px;color:#5a3a1c;display:flex;align-items:center;padding-left:8px;box-sizing:border-box;font:900 22px system-ui}
#info{font:600 12px ui-monospace,monospace;white-space:pre-wrap;background:rgba(0,0,0,.35);padding:8px;border-radius:8px}
button{font:800 16px system-ui;padding:10px 14px;border-radius:12px;border:0;background:#5cc23e;color:#fff;margin-top:6px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main>
  <div class="row"><b>H</b><div class="html">Мыло? Жук</div></div>
  <div class="row"><b>1</b><canvas class="t" id="c1"></canvas></div>
  <div class="row"><b>2</b><canvas class="t" id="c2"></canvas></div>
  <div class="row"><b>3</b><canvas class="t" id="c3"></canvas></div>
  <div class="row"><b>4</b><canvas class="t" id="c4"></canvas></div>
  <button id="mem">Нагрузить память, как игра</button>
  <div id="info"></div>
</main>
<script>
// H — HTML text for reference. 1 — text drawn straight into a small canvas. 2 — drawn into another canvas, then copied 1:1.
// 3 — drawn through a scale transform, like the game HUD. 4 — copied at a fractional pixel offset.
// The background canvas covers the whole screen, like the game's.
const dpr = devicePixelRatio || 1, hold = [];
function text(x, s = 1) {
  x.fillStyle = '#5a3a1c'; x.font = `900 ${22 * s}px system-ui`; x.textBaseline = 'middle'; x.fillText('Мыло? Жук', 8 * s, 28 * s);
  for (let i = 0; i < 8; i++) { x.fillStyle = i % 2 ? '#000' : '#fff'; x.fillRect((200 + i * 2) * s, 14 * s, 1 * s, 28 * s); }
  x.strokeStyle = '#000'; x.lineWidth = 1 / dpr; x.strokeRect(222 * s + .5 / dpr, 12 * s + .5 / dpr, 66 * s, 32 * s);
}
function size(cv) { cv.width = Math.round(cv.clientWidth * dpr); cv.height = Math.round(cv.clientHeight * dpr); return cv.getContext('2d'); }
function off(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function draw() {
  let x = size(c1); x.setTransform(dpr, 0, 0, dpr, 0, 0); text(x);
  const o = off(c2.clientWidth * dpr, c2.clientHeight * dpr), ox = o.getContext('2d'); ox.setTransform(dpr, 0, 0, dpr, 0, 0); text(ox);
  x = size(c2); x.drawImage(o, 0, 0);
  x = size(c3); x.setTransform(dpr * 1.3, 0, 0, dpr * 1.3, 0, 0); x.scale(1 / 1.3, 1 / 1.3); text(x);
  x = size(c4); x.drawImage(o, .4, .4);
  const bg = document.getElementById('bg'); bg.style.width = innerWidth + 'px'; bg.style.height = innerHeight + 'px';
  bg.width = Math.round(innerWidth * dpr); bg.height = Math.round(innerHeight * dpr);
  const b = bg.getContext('2d'); b.setTransform(dpr, 0, 0, dpr, 0, 0); b.fillStyle = '#4f8a32'; b.fillRect(0, 0, innerWidth, innerHeight);
  b.fillStyle = '#fff'; b.font = '900 30px system-ui'; b.fillText('ФОН-ХОЛСТ 123', 14, innerHeight - 40);
  for (let i = 0; i < 40; i++) { b.fillStyle = i % 2 ? '#000' : '#fff'; b.fillRect(14 + i / dpr * 1, innerHeight - 24, 1 / dpr, 14); }
  const vv = visualViewport;
  document.getElementById('info').textContent =
    `dpr ${devicePixelRatio}  окно ${innerWidth}×${innerHeight}  экран ${screen.width}×${screen.height}\n` +
    `visualViewport ${vv ? `${vv.width.toFixed(1)}×${vv.height.toFixed(1)} scale ${vv.scale}` : 'нет'}\n` +
    `фон-холст ${bg.width}×${bg.height} css ${bg.clientWidth}×${bg.clientHeight}\n` +
    `холстов в памяти ${hold.length}  ${navigator.userAgent.replace(/^Mozilla\/5.0 /, '')}`;
}
document.getElementById('mem').onclick = () => {
  for (let i = 0; i < 6; i++) { const c = off(1200, 2600), x = c.getContext('2d'); x.fillStyle = '#7cc456'; x.fillRect(0, 0, 1200, 2600); hold.push(c); }
  for (let i = 0; i < 60; i++) { const c = off(280, 330); c.getContext('2d').fillRect(0, 0, 10, 10); hold.push(c); }
  draw();
};
addEventListener('resize', draw); draw();
</script>
</body>
</html>
