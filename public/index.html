<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3d7a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fruit Defense">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Fruit Defense</title>
<style>
@font-face{font-family:Nunito;font-weight:900;font-display:block;src:url(vendor/nunito-cyrillic-900-normal.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-weight:900;font-display:block;src:url(vendor/nunito-latin-900-normal.woff2) format('woff2')}
:root{--bar:46px;--side:70px;--gap:6px;--green:#4cbb45;--dark:#24361c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2d4a1f;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:Nunito,system-ui,sans-serif;font-weight:900}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:grid;background:radial-gradient(ellipse at 50% 40%,#4f8a32,#24401a 75%)}
/* landscape: top bar, bonuses | field | traps */
@media (orientation:landscape){#app{grid-template-columns:var(--side) 1fr var(--side);grid-template-rows:var(--bar) 1fr;grid-template-areas:"top top top" "bon field traps"}
  #bonuses,#traps{flex-direction:column}}
/* portrait: top bar, field, bonuses, traps */
@media (orientation:portrait){#app{grid-template-columns:1fr;grid-template-rows:var(--bar) 1fr auto auto;grid-template-areas:"top" "field" "bon" "traps"}
  #bonuses,#traps{flex-direction:row}}
#top{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 8px;min-width:0}
#field{grid-area:field;position:relative;min-width:0;min-height:0}
#field canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bonuses{grid-area:bon;display:flex;align-items:center;justify-content:center;gap:var(--gap);padding:4px}
#traps{grid-area:traps;display:flex;align-items:center;justify-content:center;gap:var(--gap);padding:4px}
.pill{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px;border-radius:17px;background:rgba(0,0,0,.28);font-size:16px;white-space:nowrap;flex:none}
.pill img,.pill svg{width:22px;height:22px}
.round{width:38px;height:38px;border-radius:19px;background:rgba(0,0,0,.28);display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.round:active,.tbtn:active,.bbtn:active{transform:scale(.94)}
#hpbar{width:58px;height:10px;border-radius:5px;background:rgba(0,0,0,.35);overflow:hidden}
#hpbar i{display:block;height:100%;background:linear-gradient(#8ff06a,#3fae2a);border-radius:5px;transition:width .2s}
#hpbar.low i{background:linear-gradient(#ffb08a,#e8402a)}
.spacer{flex:1}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#f2c21a 45%,#b07a00);box-shadow:inset 0 0 0 2px rgba(150,90,0,.5);flex:none}
.gem{width:20px;height:20px;flex:none;background:linear-gradient(135deg,#d6f6ff,#3ac0f0 50%,#1a6ab8);clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%)}
.tbtn{position:relative;width:60px;height:62px;border-radius:16px;background:linear-gradient(#5b6b52,#3a4733);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:3px;flex:none}
.tbtn img{width:42px;height:42px;pointer-events:none}
.tbtn b{font-size:14px;line-height:1;display:flex;align-items:center;gap:3px}
.tbtn b .coin{width:12px;height:12px}
.tbtn.poor{filter:grayscale(.85) brightness(.75)}
.tbtn.sel{background:linear-gradient(#ffb03a,#e0661a);box-shadow:0 0 0 3px #fff6,inset 0 -3px 0 rgba(0,0,0,.25)}
.tbtn[hidden],.bbtn[hidden]{display:none}
.bbtn{--p:0;position:relative;width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;background:conic-gradient(#ffd23a calc(var(--p)*1turn),rgba(0,0,0,.35) 0)}
.bbtn::before{content:'';position:absolute;inset:4px;border-radius:50%;background:linear-gradient(#4a5a42,#2c3826)}
.bbtn img{position:relative;width:34px;height:34px;filter:grayscale(.7) brightness(.8)}
.bbtn.ready::before{background:radial-gradient(circle at 40% 35%,#ffe9a0,#f2a01a)}
.bbtn.ready img{filter:none}
.bbtn.ready{animation:ready 1.2s ease-in-out infinite}
.bbtn.aim::before{background:radial-gradient(circle,#fff,#7ad0ff)}
@keyframes ready{50%{box-shadow:0 0 14px 3px #ffd23a}}
#float{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:2;display:flex;gap:8px}
.big{height:46px;padding:0 22px;border-radius:23px;background:linear-gradient(#6ad65a,#3a9e2c);box-shadow:0 4px 0 #2a7a20,0 6px 12px rgba(0,0,0,.35);font-size:20px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.big.alt{background:linear-gradient(#ffcf5a,#f29a1a);box-shadow:0 4px 0 #b0600a,0 6px 12px rgba(0,0,0,.35)}
.big:active{transform:translateY(2px)}
.big[hidden]{display:none}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:2;background:rgba(0,0,0,.55);padding:8px 14px;border-radius:14px;font-size:15px;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center;max-width:90%}
#hint.show{opacity:1}
#pop{position:absolute;z-index:3;display:flex;gap:6px;padding:6px;border-radius:16px;background:rgba(30,40,25,.88);box-shadow:0 6px 16px rgba(0,0,0,.4);transform:translate(-50%,-100%)}
#pop[hidden]{display:none}
#pop button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;height:58px;border-radius:12px;background:#4cbb45;font-size:13px;padding:0 6px;gap:2px}
#pop button b{display:flex;align-items:center;gap:3px;font-size:16px}
#pop button b .coin{width:14px;height:14px}
#pop .sell{background:#c9773a}
#pop button:disabled{opacity:.45}
/* overlays */
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(15,25,10,.55);padding:16px;touch-action:auto}
.screen[hidden]{display:none}
.card{background:#fff8ea;color:#3b3a36;border-radius:26px;padding:20px 18px 16px;width:100%;max-width:400px;max-height:100%;overflow:auto;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);-webkit-overflow-scrolling:touch}
.card h1{margin:0 0 6px;font-size:30px;color:#e0393f}
.card h2{margin:0 0 10px;font-size:22px;color:#2f6b28}
.card p{margin:6px 0 12px;font-size:15px;color:#6d675a;font-weight:700;line-height:1.35}
.btn{border-radius:16px;padding:12px 20px;background:var(--green);color:#fff;font-size:18px;box-shadow:0 4px 0 #2f8c2c;margin:4px}
.btn.alt{background:#f2ead6;color:#5d5747;box-shadow:0 4px 0 #d8ccad}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #2f8c2c}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.res{width:100%;border-collapse:collapse;font-size:16px;margin:6px 0 10px}
.res td{padding:5px 4px;border-bottom:1px solid #eadfc6;text-align:left}
.res td+td{text-align:right}
.res tr.total td{font-size:20px;color:#2f6b28;border:0}
.intro img{width:96px;height:96px}
.intro h3{margin:4px 0;font-size:22px;color:#3b3a36}
.shoprow{display:flex;align-items:center;gap:10px;background:#f2ead6;border-radius:14px;padding:8px 10px;margin:7px 0;text-align:left}
.shoprow .ic{width:42px;height:42px}
.shoprow .tx{flex:1;display:flex;flex-direction:column}
.shoprow .tx span{font-size:13px;color:#6d675a;font-weight:700}
.shoprow .btn{padding:8px 12px;font-size:16px;display:flex;align-items:center;gap:4px;margin:0}
.setrow{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;font-size:15px;color:#6d675a}
/* level select */
#home{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 12px 20px;background:radial-gradient(ellipse at 50% 20%,#7cc84e,#2d5a1f 80%);touch-action:auto}
#home[hidden]{display:none}
#home .logo{display:flex;align-items:center;gap:12px;margin:6px 0 2px}
#home .logo img{width:70px;height:70px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
#home .logo h1{margin:0;font-size:38px;line-height:1;text-shadow:0 3px 0 #2a5a1a,0 6px 14px rgba(0,0,0,.3)}
#home .sub{opacity:.85;font-size:15px;margin-bottom:10px}
#home .hbar{display:flex;gap:8px;align-items:center;margin:6px 0 10px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.tab{display:flex;align-items:center;gap:6px;padding:6px 14px 6px 6px;border-radius:22px;background:rgba(0,0,0,.25);font-size:16px}
.tab img{width:32px;height:32px}
.tab.on{background:#fff8ea;color:#2f6b28}
.tab:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:520px}
.lv{aspect-ratio:1;border-radius:20px;background:radial-gradient(circle at 40% 30%,#fff6d0,#f2c25a 60%,#c88a20);color:#6a3a00;box-shadow:0 5px 0 #8a5a10,0 8px 14px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;position:relative}
.lv small{font-size:11px;opacity:.75}
.lv.done{background:radial-gradient(circle at 40% 30%,#eaffd0,#8ad05a 60%,#4a9a2a);color:#1f4a10;box-shadow:0 5px 0 #2f6a1a,0 8px 14px rgba(0,0,0,.3)}
.lv:disabled{background:rgba(0,0,0,.25);color:rgba(255,255,255,.5);box-shadow:none}
.lv:active:not(:disabled){transform:translateY(3px)}
#cont{margin-bottom:12px}
#rotate{display:none}
@media (max-width:430px){.pill{padding:0 8px;font-size:15px;gap:4px}#hpbar{width:42px}#top{gap:5px;padding:0 6px}.round{width:34px;height:34px}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button id="menuBtn" class="round" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="2" width="4" height="14" rx="1.5" fill="#fff"/><rect x="11" y="2" width="4" height="14" rx="1.5" fill="#fff"/></svg></button>
    <span class="pill"><img id="hpIcon" alt=""><span id="hpbar"><i></i></span></span>
    <span class="pill"><img id="waveIcon" alt=""><span id="waveTxt"></span></span>
    <span class="spacer"></span>
    <span class="pill"><i class="coin"></i><span id="coinsTxt">0</span></span>
    <button class="pill" id="shopBtn"><i class="gem"></i><span id="gemsTxt">0</span></button>
    <button class="round" id="speedBtn">1×</button>
  </div>
  <div id="field">
    <canvas id="cv"></canvas>
    <div id="hint"></div>
    <div id="pop" hidden><button id="upBtn"></button><button id="sellBtn" class="sell"></button></div>
    <div id="float"><button id="startBtn" class="big"></button><button id="callBtn" class="big alt" hidden></button></div>
  </div>
  <div id="bonuses"></div>
  <div id="traps"></div>
</div>

<div id="home" hidden>
  <div class="logo"><img id="logoImg" alt=""><h1>Fruit Defense</h1></div>
  <div class="sub" id="tagline"></div>
  <div class="hbar"><span class="pill"><i class="gem"></i><span id="homeGems">0</span></span><button class="round" id="homeSet" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#fff" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.5 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button></div>
  <button id="cont" class="big alt" hidden></button>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="modal" class="screen" hidden><div class="card" id="card"></div></div>

<script type="module" src="view.js"></script>
</body>
</html>
