<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3d7a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fruit Defense">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Fruit Defense</title>
<style>
@font-face{font-family:Nunito;font-weight:900;font-display:block;src:url(vendor/nunito-cyrillic-900-normal.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-weight:900;font-display:block;src:url(vendor/nunito-latin-900-normal.woff2) format('woff2')}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2d4a1f;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:Nunito,system-ui,sans-serif;font-weight:900}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#cv{position:fixed;left:0;top:0;display:block;filter:saturate(1.12) contrast(1.05)}
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(15,25,10,.55);padding:16px}
.screen[hidden],#home[hidden]{display:none}
.card{background:linear-gradient(#fffaf0,#fbe9c6);color:#5a3a1c;border-radius:26px;border:3px solid #6a3e1c;box-shadow:0 5px 0 #6a3e1c,0 14px 40px rgba(0,0,0,.4);padding:18px 22px 16px;min-width:300px;max-width:440px;text-align:center}
.card h1{margin:0 0 4px;font-size:30px;color:#e0393f;text-shadow:0 2px 0 #fff}
.card h1.win{color:#3f9a2a}
.card h2{margin:0 0 12px;font-size:26px;color:#6a3e1c}
.card p{margin:4px 0 14px;font-size:15px;color:#8a6a4a}
.stars{font-size:46px;line-height:1;color:#ffc72a;text-shadow:0 3px 0 #b07a00,0 0 12px rgba(255,200,40,.6);letter-spacing:4px}
.stars s{text-decoration:none;color:#d8c8a8;text-shadow:0 3px 0 #a89878}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border-radius:18px;padding:10px 20px;background:linear-gradient(#7ee05a,#3ea52a);color:#fff;font-size:18px;border:2.5px solid #1f6a17;box-shadow:0 4px 0 #1f6a17;text-shadow:0 2px 0 #1f5a14}
.btn.alt{background:linear-gradient(#fff3d6,#f2d9a8);color:#6a3e1c;border-color:#6a3e1c;box-shadow:0 4px 0 #6a3e1c;text-shadow:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1f6a17}
#home{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;background:radial-gradient(ellipse at 50% 35%,rgba(140,215,90,.55),rgba(30,70,20,.85) 75%)}
#home .logo{display:flex;align-items:center;gap:14px}
#home .logo img{width:84px;height:84px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
#home h1{margin:0;font-size:46px;line-height:1;text-shadow:0 4px 0 #2a5a1a,0 8px 18px rgba(0,0,0,.35)}
#home .sub{font-size:17px;opacity:.92;margin-bottom:6px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#levels{display:flex;gap:16px}
.lv{width:132px;height:118px;border-radius:24px;background:linear-gradient(#fffaf0,#f2d9a8);color:#6a3e1c;border:3px solid #6a3e1c;box-shadow:0 6px 0 #6a3e1c,0 10px 20px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lv b{font-size:34px;line-height:1}.lv span{font-size:15px}.lv i{font-style:normal;font-size:20px;color:#f2a81a;letter-spacing:2px;text-shadow:0 2px 0 #b07a00}
.lv.done{background:linear-gradient(#f2ffe0,#bfe89a)}
.lv:disabled{opacity:.55;filter:grayscale(.6)}
.lv:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #6a3e1c}
#rotate{display:none;position:fixed;inset:0;z-index:20;background:#2d4a1f;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;font-size:20px;padding:24px}
#rotate .ph{width:60px;height:100px;border:5px solid #fff;border-radius:12px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:820px){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="home" hidden>
  <div class="logo"><img id="logo" alt=""><h1>Fruit Defense</h1></div>
  <div class="sub">Посади растения — не пусти жуков к яблоку</div>
  <div id="levels"></div>
</div>
<div id="modal" class="screen" hidden><div class="card" id="card"></div></div>
<div id="rotate"><div class="ph"></div>Поверни телефон горизонтально</div>
<script type="module" src="view.js"></script>
</body>
</html>
